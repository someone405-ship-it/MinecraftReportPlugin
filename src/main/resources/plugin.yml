name: MinecraftReportPlugin
version: '${project.version}'
main: com.reportplugin.ReportPlugin
api-version: '1.21'
author: someone405
description: Elite player reporting with GUI, ultra-fancy Discord embeds, avatars, body renders, cooldowns, weekly limits & staff tools
commands:
  report:
    description: Report a player (opens GUI or direct)
    usage: /report [player] [reason]
    permission: reportplugin.report
    aliases: [rep, reportplayer]
  reports:
    description: List open reports (staff)
    usage: /reports
    permission: reportplugin.staff
    aliases: [reportlist, viewreports]
  reportview:
    description: View a specific report
    usage: /reportview <id>
    permission: reportplugin.staff
  reportclose:
    description: Close a report
    usage: /reportclose <id>
    permission: reportplugin.staff
  reportreload:
    description: Reload configuration
    usage: /reportreload
    permission: reportplugin.admin
permissions:
  reportplugin.report:
    description: Allows reporting players
    default: true
  reportplugin.staff:
    description: View and manage reports + receive notifications
    default: op
  reportplugin.admin:
    description: Full admin (bypass cooldowns, reload)
    default: op
