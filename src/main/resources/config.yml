# ============================================
# Minecraft Report Plugin - Configuration
# ============================================

# Discord Webhook URL (REQUIRED)
webhook-url: "https://discord.com/api/webhooks/1556496398046724107/g2m--vMPw50fKJo3XNxoNlFsfWQd7gjR69G7KpSWtNHv6u8D8IrcOzUrhlPhWT4MxCwA"

# Server name shown in the embed
server-name: "My Minecraft Server"

# Embed settings
embed:
  # Color in decimal (e.g. 5763719 = green, 15158332 = red, 3447003 = blue)
  color: 15158332
  # Title of the embed
  title: "🚨 New Player Report"
  # Footer text
  footer: "Minecraft Report System • Anti-Spam Protected"

# Cooldown settings (in seconds)
cooldowns:
  # Global cooldown between any reports from the same player (prevents spam)
  global-seconds: 60
  # How long until the same player can be reported again by the same reporter (1 week = 604800 seconds)
  same-player-seconds: 604800

# Messages (supports color codes with &)
messages:
  prefix: "&8[&cReport&8] &r"
  success: "&aYour report against &e%target% &ahas been submitted successfully!"
  player-not-found: "&cPlayer &e%target% &cwas not found (they may be offline)."
  cannot-report-self: "&cYou cannot report yourself!"
  global-cooldown: "&cPlease wait &e%time% &cbefore submitting another report."
  same-player-cooldown: "&cYou already reported &e%target% &crecently. You can report them again in &e%time%&c."
  no-permission: "&cYou do not have permission to use this command."
  usage: "&cUsage: /report <player> <reason>"
  reason-too-short: "&cPlease provide a more detailed reason (at least 5 characters)."
  webhook-error: "&cFailed to send the report. Please contact an administrator."

# Minimum reason length
min-reason-length: 5

# Whether offline players can be reported (uses name lookup)
allow-offline-reports: true
