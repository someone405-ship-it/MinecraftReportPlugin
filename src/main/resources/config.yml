# ============================================================
#  ELITE REPORT PLUGIN - Ultimate Webhook Edition
# ============================================================

webhook-url: "https://discord.com/api/webhooks/1556496398046724107/g2m--vMPw50fKJo3XNxoNlFsfWQd7gjR69G7KpSWtNHv6u8D8IrcOzUrhlPhWT4MxCwA"

server-name: "Elite Minecraft Network"

# ============================================================
#  ULTRA FANCY EMBED SETTINGS
# ============================================================
embed:
  # Default color (overridden by priority)
  color: 16711680
  title: "🚨 NEW PLAYER REPORT"
  footer: "Reported Users • Elite Anti-Cheat System"
  show-body-render: true
  show-reporter-skin: true
  mention-role-id: ""                    # Discord role ID to ping (optional)

  # Priority colors (decimal)
  colors:
    low: 5763719          # Green
    medium: 16776960      # Yellow
    high: 16744192        # Orange
    critical: 16711680    # Red

# ============================================================
#  COOLDOWNS & LIMITS
# ============================================================
cooldowns:
  global-seconds: 30
  same-player-seconds: 604800          # 7 days
  max-reports-per-hour: 6

# ============================================================
#  GUI
# ============================================================
gui:
  enabled: true
  title-player-select: "&8◆ &c&lREPORT &8◆ &7Select Player"
  title-reason-select: "&8◆ &c&lREPORT &8◆ &7Select Reason"
  title-priority-select: "&8◆ &c&lREPORT &8◆ &7Select Priority"
  title-confirm: "&8◆ &c&lREPORT &8◆ &7Confirm"
  player-heads: true
  show-offline-section: false

# ============================================================
#  REASONS (shown in GUI) + optional priority suggestion
# ============================================================
reasons:
  - name: "Griefing / Destroying builds"
    priority: high
  - name: "Hacking / Cheating"
    priority: critical
  - name: "Toxicity / Harassment"
    priority: medium
  - name: "Spamming"
    priority: low
  - name: "Scamming / Stealing"
    priority: high
  - name: "Exploiting / Duping"
    priority: critical
  - name: "Inappropriate content"
    priority: medium
  - name: "Other (type in chat)"
    priority: medium

# ============================================================
#  EXTRA FEATURES
# ============================================================
features:
  anonymous-reporting: false           # If true, hides reporter name in Discord
  show-playtime: false                 # Requires extra plugin (future)
  blacklist: []                        # Players that cannot be reported (names)
  # Example: ["Notch", "Dinnerbone"]

# ============================================================
#  MESSAGES
# ============================================================
messages:
  prefix: "&8[&c&lREPORT&8] &r"
  success: "&a✔ Report against &e%target% &asubmitted! &7ID: &f%id%"
  player-not-found: "&cPlayer &e%target% &cnot found."
  cannot-report-self: "&cYou can't report yourself."
  blacklisted: "&cThis player cannot be reported."
  global-cooldown: "&c⏳ Wait &e%time% &cbefore reporting again."
  same-player-cooldown: "&cYou already reported &e%target%&c. Wait &e%time%&c."
  hourly-limit: "&cHourly limit reached (&e%max%&c reports)."
  no-permission: "&cNo permission."
  usage: "&c/report [player] [reason] &7or &e/report &7for GUI"
  reason-too-short: "&cReason too short (min 5 chars)."
  webhook-error: "&cFailed to send report."
  report-closed: "&aReport &e%id% &aclosed."
  no-reports: "&7No open reports."
  staff-notify: "&c⚡ REPORT &8| &e%reporter% &7→ &c%target% &8| &f%reason% &8| &7%priority%"
  anonymous-success: "&a✔ Anonymous report submitted! &7ID: &f%id%"

# ============================================================
#  GENERAL
# ============================================================
min-reason-length: 5
allow-offline-reports: true
staff-permission: "reportplugin.staff"
sound-on-report: true
sound-on-success: true                 # Sound for the reporter too
